# Build on GitHub, ship plain files to cPanel. Node never runs on the server.
#
# Repository secrets:
#   CPANEL_HOST, CPANEL_USER, CPANEL_SSH_KEY, CPANEL_APP_PATH (e.g. /home/user/goldapp)
name: Test & deploy

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'          # same as the cPanel host
          extensions: bcmath, gd, intl, mbstring, pdo_sqlite, zip
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan test

  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: |
            backend/public/app.html
            backend/public/assets
            backend/public/sw.js
            backend/public/workbox-*.js
            backend/public/push-sw.js
            backend/public/pwa-*.png
            backend/public/favicon.svg

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [test, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: backend/public
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist
        working-directory: backend
      - name: Upload over SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CPANEL_SSH_KEY }}" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.CPANEL_HOST }}" >> ~/.ssh/known_hosts
          rsync -az --delete \
            --exclude '.env' --exclude 'storage/' --exclude 'database/database.sqlite' --exclude 'tests/' \
            -e "ssh -i ~/.ssh/id_deploy" \
            backend/ "${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }}:${{ secrets.CPANEL_APP_PATH }}/"
      - name: Migrate and cache
        run: |
          ssh -i ~/.ssh/id_deploy "${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }}" "cd ${{ secrets.CPANEL_APP_PATH }} \
            && php artisan migrate --force \
            && php artisan config:cache && php artisan route:cache && php artisan view:cache \
            && php artisan queue:restart"
