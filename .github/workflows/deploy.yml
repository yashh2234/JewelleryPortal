# Test on every push. On main, build everything the server needs (PHP vendor/ and the
# compiled front end) and commit it to the `deploy` branch. cPanel's Git Version Control
# pulls that branch; its .cpanel.yml (from deploy/cpanel.yml) copies it into place and
# migrates. Node and Composer never run on the server, and no secrets are needed.
name: Test & deploy

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'          # same as the cPanel host
          extensions: bcmath, gd, intl, mbstring, pdo_sqlite, zip
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan test

  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: |
            backend/public/app.html
            backend/public/assets
            backend/public/sw.js
            backend/public/workbox-*.js
            backend/public/push-sw.js
            backend/public/pwa-*.png
            backend/public/favicon.svg

  deploy-branch:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [test, build-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: backend/public
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist
        working-directory: backend
      - name: Commit the build to the deploy branch
        env:
          REMOTE: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          git clone --quiet --depth 1 --branch deploy "$REMOTE" out             || { git init --quiet -b deploy out && git -C out remote add origin "$REMOTE"; }
          rsync -a --delete --exclude .git --exclude /tests/ --exclude /node_modules/ --exclude /.env backend/ out/
          cp deploy/cpanel.yml out/.cpanel.yml
          cd out
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git add -f vendor public
          if git diff --cached --quiet; then echo "Nothing changed"; exit 0; fi
          git commit --quiet -m "Build of ${GITHUB_SHA::7}: $(git -C .. log -1 --format=%s)"
          git push --quiet origin deploy
